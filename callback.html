<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Вход…</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#e8e8e8;font-family:'Share Tech Mono',ui-monospace,monospace;font-size:14px}
body{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.8}
a{color:#fff}
</style>
</head>
<body>
<div id="msg">Авторизация…</div>
<script>
(function(){
  var msg=document.getElementById('msg');
  try{
    var m=location.hash.match(/tgAuthResult=([^&]+)/);
    if(!m) throw new Error('no data');
    var b64=decodeURIComponent(m[1]).replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length%4) b64+='=';
    var bin=atob(b64), bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    var user=JSON.parse(new TextDecoder().decode(bytes));
    sessionStorage.setItem('tg_callback',JSON.stringify(user));
    location.replace('./');
  }catch(e){
    msg.innerHTML='Не удалось выполнить вход.<br><a href="./">Вернуться на главную</a>';
  }
})();
</script>
</body>
</html>
